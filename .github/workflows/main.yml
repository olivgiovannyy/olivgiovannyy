name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */24 * * *"

  workflow_dispatch:

  push:
    branches:
      - main
      - master

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:

      # ---------------------------------------------------------
      # GERA A COBRINHA
      # Vermelho = cobrinha
      # Azul = quadrados sem contribuição
      # Branco = commits
      # ---------------------------------------------------------

      - name: Generate GitHub contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}

          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23ff0000&color_dots=%230A1F44,%23ffffff,%23ffffff,%23ffffff,%23ffffff
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23ff0000&color_dots=%230A1F44,%23ffffff,%23ffffff,%23ffffff,%23ffffff


      # ---------------------------------------------------------
      # ADICIONA FUNDO AZUL AO SVG
      # ---------------------------------------------------------

      - name: Add Spider-Man blue background
        run: |
          python - <<'PY'

          from pathlib import Path
          import re

          files = [
              "dist/github-contribution-grid-snake.svg",
              "dist/github-contribution-grid-snake-dark.svg"
          ]

          for filename in files:

              path = Path(filename)

              svg = path.read_text()

              background = '''
              <rect
                  x="0"
                  y="0"
                  width="100%"
                  height="100%"
                  fill="#0A1F44"
                  rx="12"
                  ry="12"
              />
              '''

              svg = re.sub(
                  r'(<svg[^>]*>)',
                  r'\1' + background,
                  svg,
                  count=1
              )

              path.write_text(svg)

          PY


      # ---------------------------------------------------------
      # ENVIA O SVG PARA A BRANCH "output"
      # ---------------------------------------------------------

      - name: Push snake animation to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0

        with:
          target_branch: output
          build_dir: dist

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
